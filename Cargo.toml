[package]
name = "kawal"
version = "0.3.0"
edition = "2024"
description = "Fast zero-dependency Rust CLI for Android/Linux kernel merge verification, ELF64/DTB/KABI auditing, crash forensics, and live runtime leak hunting"
license = "Apache-2.0"
repository = "https://github.com/Yasvara/kawal"
homepage = "https://github.com/Yasvara/kawal"
readme = "README.md"
keywords = ["linux", "kernel", "android", "audit", "elf"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
